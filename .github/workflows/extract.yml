# Télécharge les données OpenStreetMap d'Annaba et les enregistre dans data/osm/.
name: Extraire les données OSM

on:
  push:
    branches: [main]
    paths:
      - tools/extract_osm.py
      - .github/workflows/extract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/extract_osm.py
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet || git commit -m "Update OpenStreetMap extract for Annaba"
          git push
