# Télécharge les empreintes de bâtiments (Overture Maps : OSM + détection sur images aériennes) dans data/buildings/.
name: Extraire les empreintes de bâtiments

on:
  push:
    branches: [main]
    paths:
      - tools/extract_buildings.py
      - .github/workflows/buildings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "overturemaps>=1.0" shapely
      - run: python tools/extract_buildings.py
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings
          git diff --cached --quiet || git commit -m "Update Overture building footprints for the wilaya of Annaba"
          git pull --rebase
          git push
