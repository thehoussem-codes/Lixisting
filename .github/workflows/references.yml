# Récupère des photos libres d'Annaba (Wikimedia Commons) dans la branche "references".
# Ces images servent de modèles visuels ; elles ne font pas partie du jeu.
name: Récupérer les photos de référence

on:
  push:
    branches: [main]
    paths:
      - tools/fetch_references.py
      - .github/workflows/references.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_references.py
      - name: Enregistrer dans la branche references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b references
          git add references
          git commit -qm "Reference photos of Annaba from Wikimedia Commons"
          git push -f origin references
