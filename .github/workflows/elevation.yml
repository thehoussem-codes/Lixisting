# Télécharge le relief d'Annaba et l'enregistre dans data/elevation/.
name: Extraire le relief

on:
  push:
    branches: [main]
    paths:
      - tools/extract_elevation.py
      - .github/workflows/elevation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/extract_elevation.py
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elevation
          git diff --cached --quiet || git commit -m "Update elevation grid for Annaba"
          git pull --rebase
          git push
