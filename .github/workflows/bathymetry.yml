# Télécharge la profondeur réelle de la mer (EMODnet, repli ETOPO) dans data/bathymetry/.
name: Extraire la bathymétrie

on:
  push:
    branches: [main]
    paths:
      - tools/extract_bathymetry.py
      - .github/workflows/bathymetry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rasterio pillow numpy
      - run: python tools/extract_bathymetry.py
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bathymetry
          git diff --cached --quiet || git commit -m "Update sea depth (bathymetry) around Annaba"
          git pull --rebase
          git push
